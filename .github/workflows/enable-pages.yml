name: Enable GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Pages from main /
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api repos/${{ github.repository }}/pages >/dev/null 2>&1; then
            echo "Pages already configured; updating source to main /"
            gh api -X PUT repos/${{ github.repository }}/pages \
              -f build_type=legacy \
              -f source[branch]=main \
              -f source[path]=/ || true
          else
            echo "Creating Pages site (legacy, main /)"
            gh api -X POST repos/${{ github.repository }}/pages \
              -f build_type=legacy \
              -f source[branch]=main \
              -f source[path]=/ 
          fi
          gh api repos/${{ github.repository }}/pages
